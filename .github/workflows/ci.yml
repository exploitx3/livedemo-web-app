# Equivalent to .gitlab-ci.yml (build stage jobs).
#
# Secrets (configure in repo Settings → Secrets and variables → Actions):
#   CI_MINE_USERNAME - Docker registry username
#   CI_MINE_PASSWORD - Docker registry password

name: CI

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  # Mirrors: build-app-image (automatic on develop)
  build-app-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.CI_MINE_USERNAME }}
          password: ${{ secrets.CI_MINE_PASSWORD }}

      - name: Build and push image
        env:
          IMAGE: docker.io/livedemo/livedemo-web-app
          TAG_SHA: ${{ github.sha }}
        run: |
          docker build -f ./tools/deploy/Dockerfile -t "${IMAGE}:latest" .
          docker tag "${IMAGE}:latest" "${IMAGE}:${TAG_SHA}"
          docker push "${IMAGE}:${TAG_SHA}"
          docker push "${IMAGE}:latest"

  # Mirrors: build (manual only; pick branch "develop" when running)
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install
